<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    RepoSpector icon — a lens over a diff.

    The previous icon stacked three metaphors (shield + magnifier + code
    brackets) in near-tone navy on light grey. At 128px it read as busy; at the
    16px toolbar size, which is where an extension icon actually lives, it
    collapsed into an indistinct dark blob.

    This keeps ONE idea — inspecting a change — and builds it from shapes that
    survive downsampling: a solid tile, a white disc, and two chunky bars in the
    product's own success/error colours. The green-over-red pair is what makes
    it legible as a DIFF rather than a generic search icon, and nothing else in
    the extensions category looks like it.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Tile. Full-bleed rounded square: the toolbar composites onto unknown
       backgrounds, so the icon carries its own ground rather than relying on
       one. -->
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>

  <!-- Handle, drawn first so the lens sits over its joint. -->
  <path d="M75 73 L102 100" stroke="#0f172a" stroke-width="18" stroke-linecap="round" opacity="0.92"/>

  <!-- Lens: dark ring for contrast against the indigo tile, white face so the
       diff bars keep their colour rather than tinting toward the background. -->
  <circle cx="53" cy="51" r="32" fill="#ffffff" stroke="#0f172a" stroke-width="8" opacity="0.98"/>

  <!-- The diff. Unequal lengths read as "changed", not as a list. -->
  <rect x="34" y="39" width="39" height="10" rx="5" fill="#22c55e"/>
  <rect x="34" y="56" width="27" height="10" rx="5" fill="#ef4444"/>
</svg>
