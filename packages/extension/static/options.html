<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoSpector settings</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <h1>RepoSpector settings</h1>
  <section aria-labelledby="start-h" class="start">
    <h2 id="start-h">Get started</h2>
    <ol id="checklist" class="checklist"></ol>
  </section>
  <p id="status" role="status" class="muted"></p>
  <section aria-labelledby="model-h">
    <h2 id="model-h">1. AI provider and your API key</h2>
    <div id="model"></div>
  </section>
  <section aria-labelledby="git-h">
    <h2 id="git-h">2. GitHub and GitLab</h2>
    <div id="git"></div>
  </section>
  <section aria-labelledby="vault-h">
    <h2 id="vault-h">Key security</h2>
    <div id="vault"></div>
  </section>
  <details class="advanced">
    <summary>Advanced</summary>
    <section aria-labelledby="feedback-h">
      <h2 id="feedback-h">Feedback</h2>
      <div id="feedback"></div>
    </section>
    <section aria-labelledby="meaning-h">
      <h2 id="meaning-h">Meaning-based matching</h2>
      <div id="meaning"></div>
    </section>
    <section aria-labelledby="index-h">
      <h2 id="index-h">Saved code index</h2>
      <div id="saved-index"></div>
    </section>
  </details>
  <footer class="links muted"><a href="help.html" target="_blank">Help</a> · <a href="privacy.html" target="_blank">Privacy policy</a></footer>
  <script type="module" src="options.js"></script>
</body>
</html>
